id: B8
name: intent vs outcome
area: B
tier: 2
status: draft
contrast:
  positive: the agent believes the act will harm someone (harmful intent)
  negative: the agent believes the same act is harmless (no harmful intent)
  not_this:
    - the act (one action sentence, identical in all four versions)
    - the outcome (crossed within every scenario, labelled meta.outcome; the outcome contrast is read from the same items)
    - the setting and the people (same background sentence)
    - length (belief sentences and outcome sentences each length-matched, ratio 0.7-1.4)
grounding:
  - Cushman 2008, wrongness judgments track the agent's mental state; punishment also tracks the outcome
  - Young, Cushman, Hauser and Saxe 2007; Young and Saxe 2008, the belief x outcome design (intentional, attempted, accidental harm, neutral)
  - Aristotle, NE III.1, ignorance of particulars as an excusing condition
frames:
  a:
    applies: true
    realization: the user tells the four-sentence story (background, belief, action, outcome) and asks what the model makes of it
    readout: boundary
    construction: generated
    source: gemma-4-31B-it, settings from Moral Stories care situations
  b:
    applies: true
    realization: the same story; the user asks whether what the agent did was morally acceptable
    readout: boundary
    construction: generated
    source: gemma-4-31B-it, settings from Moral Stories care situations
  c:
    applies: false
    realization: not in CONCEPTS.md for this row
  d:
    applies: false
    realization: not in CONCEPTS.md for this row
sources:
  - {dataset: generated by gemma-4-31B-it (belief x outcome stories), url: "", license: "generated for this project", used_for: "all contrast items and behavior items", n_available: 0}
  - {dataset: Moral Stories (situations used only as settings), url: "https://huggingface.co/datasets/wassname/moral_stories_foundations", license: "MIT + CC-BY-SA-4.0", used_for: "settings for generation", n_available: 5523}
  - {dataset: MoCa causal stories (Nie et al. 2023), url: "https://github.com/cicl-stanford/moca", license: "none stated", used_for: "held-out only", n_available: 43}
heldout:
  {dataset: MoCa causal stories with an agent-awareness annotation, url: "https://github.com/cicl-stanford/moca", license: "none stated", frame: b, n: 43, notes: "pos = the agent knew (AK aware), neg = the agent did not know; MoCa's own causal question; human yes-share in meta; never enters generation or selection. Only 43 exist"}
behavior:
  {instrument: belief x outcome wrongness, dataset: generated (50 stories not in the contrast items, all four cells), url: "", metric: "effect of belief and effect of outcome on the share of 'wrong' answers; humans: belief dominates (Cushman 2008)", scoring: choice, n: 200}
risks:
  - no released matched set was found, so every contrast item is generated; Harsh reviews the stories
  - the harmful-belief sentence names harm, so a direction may carry harm words; the outcome sentence names harm in half the neg items too, which separates the two
  - held-out is small (43) and about causal judgment, not wrongness
