id: F4
name: fairness vs loyalty
area: F
tier: 2
status: draft
partners: ["B2", "B3"]            # meta.partners on every item: the two concepts whose balance the conflict tests
contrast:
  positive: the option that puts fairness first (the same standard for everyone, impartial treatment)
  negative: the option that puts loyalty first (standing by a friend, family member, team or group)
  not_this:
    - which option is better overall (no ground truth)
    - the situation (both options answer the same dilemma)
    - answer length (matched by the generator)
grounding:
  - Graham et al. 2013, fairness and loyalty as separate foundations that can pull apart
  - Ross 1930, duties of justice and of special relationships
frames:
  a:
    applies: false
    realization: "not used for conflicts: b and c carry the trade-off (task brief); a third party's choice in frame b already shows the conflict"
  b:
    applies: true
    realization: the user quotes the dilemma and what the person did, then asks whether it was the right choice
    readout: boundary
    construction: generated
    source: generated dilemmas (gemma-4-31B-it)
  c:
    applies: true
    realization: the dilemma is the user turn; the assistant turn is prefilled with a first-person decision and one reason (25-40 words), written with the dilemma
    readout: response
    construction: generated
    source: generated dilemmas (gemma-4-31B-it)
  d:
    applies: false
    realization: not used for conflicts (task brief)
sources:
  - {dataset: "generated by gemma-4-31B-it in the DailyDilemmas style, settings from Moral Stories loyalty situations", url: "", license: "generated for this project", used_for: "contrast scenarios and behavior", n_available: 0}
  - {dataset: "DailyDilemmas (fairness vs loyalty values)", url: "https://huggingface.co/datasets/kellycyy/daily_dilemmas", license: "CC-BY-4.0", used_for: "held-out only", n_available: 32}
  - {dataset: "AIRiskDilemmas (fairness vs loyalty values)", url: "https://huggingface.co/datasets/kellycyy/AIRiskDilemmas", license: "CC-BY-4.0", used_for: "held-out only", n_available: 4}
  - {dataset: "CLASH", url: "https://huggingface.co/datasets/launch/CLASH", license: "MIT", used_for: "not used: no dilemma pits fairness against loyalty", n_available: 0}
heldout:
  {dataset: DailyDilemmas + AIRiskDilemmas, url: "https://huggingface.co/datasets/kellycyy/daily_dilemmas", license: "CC-BY-4.0", frame: b, n: 62, notes: "every real fairness-loyalty dilemma that passes the conflict check (22 DailyDilemmas, 9 AIRiskDilemmas), both options; pos = fairness option; never enters generation or selection"}
behavior:
  {instrument: two-option choice, dataset: generated dilemmas not in the contrast items, url: "", metric: "share of choices for fairness; positions counterbalanced", scoring: choice, n: 200}
risks:
  - almost no released fairness-loyalty dilemmas exist, so contrast and behavior items are generated; the held-out set is every real one that passes the conflict check (62 items)
  - generated fair and loyal options may differ in who benefits; the review sample shows both
  - in many generated dilemmas the fair option is also the honest one (telling the truth vs keeping a friend's secret), which overlaps F1
