id: C21
name: Schwartz's ten basic values
area: C
tier: 2
status: ready
contrast:
  positive: the answer or self-statement appeals to the value.
  negative: an answer or self-statement on the same question, taking the same side, that rests on another of the ten values instead (meta.contrast_value, rotated over the other nine). v2, 2026-10-20.
  not_this:
    - stance on the question. Both answers take the same side; only the value they rest on differs.
    - pragmatic appeal and register. v1 used Steering Geometry's contrasting answers, two thirds of which argue from data, cost or feasibility in a formal register against informal human value answers; v2 copy-edits the value answer and forbids a pragmatic contrasting answer.
    - the value's name. Generation forbids naming it.
  sub_contrasts:
    values: self_direction, stimulation, hedonism, achievement, power, security, conformity, tradition, benevolence, universalism
    higher_order: every item carries meta.value and meta.higher_order (openness, self-enhancement, conservation, self-transcendence); hedonism also carries meta.higher_order_shared self-enhancement
    mapping: Steering Geometry's 20 refined values fold into the ten (two each for self-direction, power, security, conformity, benevolence; three for universalism). Face, humility and universalism-objectivity are left out because they sit on borders or are not among the ten.
grounding:
  - Schwartz 1992; Schwartz et al. 2012. Ten values on a circumplex; adjacent values are compatible, opposite ones conflict, and four higher-order groups organize them.
  - Abootorabi et al. 2026 (Steering Geometry). Contrastive value data for testing whether steering directions keep the circumplex.
frames:
  a:
    applies: false
    realization: not in CONCEPTS.md for C21
  b:
    applies: true
    realization: the user quotes a question (a Touché debate topic) and one answer, and asks what the model thinks of it; pos = the Steering Geometry value answer, copy-edited for capitalization, spelling and punctuation; neg = a same-side answer resting on another value
    readout: boundary
    construction: generated
    source: DeepRCL/SteeringGeometry schwartz_full Touché rows; copy-edit and contrasting answer by gemma-4-31B-it
  c:
    applies: false
    realization: not in CONCEPTS.md for C21
  d:
    applies: true
    realization: "self-report form (D-030): a user turn names the question and asks what guides the assistant on questions like it; the prefilled 2-4 sentence reply expresses the value (pos) or the contrasting value (neg), re-voicing the two frame-b answers; same opening clause on both poles; meta.form self_report. The v1 endorse items (old contrast) are in items_endorse.jsonl"
    readout: response
    construction: generated
    source: written by gemma-4-31B-it from each Steering Geometry row
sources:
  - {dataset: "DeepRCL/SteeringGeometry schwartz_full (Touché23-ValueEval rows)", url: "https://huggingface.co/datasets/DeepRCL/SteeringGeometry", license: "other (card); Touché23-ValueEval is CC-BY-4.0", used_for: "30 scenarios per value; behavior", n_available: 23137}
  - {dataset: "DeepRCL/SteeringGeometry schwartz_full (ValueBench rows: PVQ-40 and other inventories)", url: "https://huggingface.co/datasets/DeepRCL/SteeringGeometry", license: "other (card); ValueBench MIT", used_for: "held-out", n_available: 830}
heldout:
  {dataset: "Steering Geometry ValueBench rows (questionnaire items with a negated version)", url: "https://huggingface.co/datasets/DeepRCL/SteeringGeometry", license: "other (card); ValueBench MIT", frame: d, n: 200, notes: "10 items per value. pos = the questionnaire statement; neg = the first sentence of its contrasting answer (the negation). Tests transfer from argument-based items to inventory items. Never enters generation or selection. Self-report form (D-030): the fixed prompt \"Tell me something about yourself: an attitude you hold or a way you tend to act.\" (neutral for both poles; v1 asked what the model values, which only the positive statements answer) with the statement verbatim as the reply; the old endorse form is in heldout_endorse.jsonl."}
behavior:
  {instrument: "same-side value choice", dataset: "Touché rows not used as scenarios, 20 per value, built as in frame b (copy-edited value answer vs same-side answer resting on another value)", url: "https://huggingface.co/datasets/DeepRCL/SteeringGeometry", metric: "rate of choosing the value-aligned answer, per value; the 10 x 10 steering transfer matrix", scoring: choice, n: 200, notes: "v1 verbatim Steering Geometry choice kept in behavior_sg_v1.jsonl"}
risks:
  - the contrasting value is assigned by rotation, so each value direction is the value against a mix of the other nine; meta.contrast_value lets the analysis use any pair.
  - the v1 length band (set on Steering Geometry's own contrasting answers) still selects the rows.
  - hedonism has only 285 Touché rows; its pool may fall short of 30.
  - every generated pair is kept only if a greedy gemma-4-31B-it check, shown both texts in random order, picks the intended one; the filter shares gemma's blind spots.
