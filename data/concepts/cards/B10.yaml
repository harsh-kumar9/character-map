id: B10
name: keep the rule vs justified exception
area: B
tier: 2
status: draft
contrast:
  positive: someone breaks a rule for a reason that makes the exception justified
  negative: someone breaks the same rule, in the same way, for a reason that does not justify it
  not_this:
    - the rule, the setting and the act (identical in both versions)
    - harm caused by the act (the same act in both)
    - length (generated pairs kept at ratio 0.75-1.33)
grounding:
  - Dancy 2004, particularism; whether a reason counts depends on the case
  - Awad et al. 2022, when people accept breaking a rule (MoralExceptQA), human acceptance shares per case
frames:
  a:
    applies: false
    realization: not in CONCEPTS.md for this row
  b:
    applies: true
    realization: the story of the rule-breaking, then a question whether it was OK in this case
    readout: boundary
    construction: adapted
    source: MoralExceptQA pairs; the rest generated by gemma-4-31B-it from Moral Stories norms
  c:
    applies: false
    realization: not in CONCEPTS.md for this row
  d:
    applies: false
    realization: not in CONCEPTS.md for this row
sources:
  - {dataset: MoralExceptQA (Awad et al. 2022), url: "https://huggingface.co/datasets/feradauto/MoralExceptQA", license: "none stated on the HF card", used_for: "pairs within one setting: the reason with the highest human acceptance (pos) vs the lowest (neg), gap >= 0.3, up to 3 pairs per setting", n_available: 148}
  - {dataset: generated by gemma-4-31B-it in the MoralExceptQA style, url: "", license: "generated for this project", used_for: "the remaining scenarios; rule taken from a Moral Stories authority or fairness norm", n_available: 0}
heldout:
  {dataset: ETHICS deontology (test), url: "https://huggingface.co/datasets/hendrycks/ethics", license: "MIT", frame: b, n: 100, notes: "a request or duty and an excuse for not doing it; pos = reasonable excuse, neg = unreasonable; never enters generation or selection"}
behavior:
  {instrument: ETHICS deontology excuse judgment, dataset: ETHICS deontology (test_hard), url: "https://huggingface.co/datasets/hendrycks/ethics", metric: "accuracy against ETHICS labels on whether the excuse is reasonable", scoring: choice, n: 200}
risks:
  - MoralExceptQA has few settings, so several pairs share a setting sentence (up to 3 per setting) and may fall into different splits
  - generated justified reasons can add an urgent or sympathetic tone; the human-made MoralExceptQA pairs and the held-out set check this
  - pos is the justified exception, so a direction may also read as "acceptable"; B1-B6 neg items (norm-observing acts) give a comparison
