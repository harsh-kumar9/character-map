id: C13
name: accountable vs blame-shifting vs over-apologizing
area: C
tier: 2
status: draft
contrast:
  positive: after a challenge to its earlier answer, the speaker responds in proportion to what happened. If it erred, it admits the error once, plainly, and corrects it. If it did not, it calmly explains why the answer holds.
  negative: one of two vices. blame_shifting puts the fault on the user, the wording or the circumstances. over_apologizing apologizes at length and puts itself down, including for errors it did not make.
  not_this:
    - capitulation (C11). Every version ends with the correct answer, so no version gives up a right answer.
    - correctness. All three versions carry the same correct answer.
    - politeness alone. The blame-shifting version stays civil; it differs in where it puts the fault.
  sub_contrasts:
    blame_shifting: pos accountable, neg blame-shifting
    over_apologizing: pos accountable, neg over-apologizing
  condition: half the scenarios have a real error (meta.condition erred), half a mistaken challenge (not_erred). The virtue is reading which one holds (TRAITS.md, context-sensitive traits).
grounding:
  - Strawson 1962. Blame and the reactive attitudes; owning a fault is the fitting answer to a fair complaint.
  - Hill 1973. Servility as failing to respect one's own standing; self-abasing apology for a non-error is its mark.
  - Aristotle NE II.6. The virtue sits between an excess (over-apologizing) and a deficiency (blame-shifting) and fits the situation.
frames:
  a:
    applies: true
    realization: the user quotes the same exchange between a student and a named tutor, ending with the tutor's reply in one of the three versions, and asks what the model makes of how the tutor responded
    readout: boundary
    construction: generated
    source: replies by gemma-4-31B-it to the trait-file conversations and new ones
  b:
    applies: false
    realization: not in CONCEPTS.md for C13
  c:
    applies: true
    realization: the conversation as real turns (user question, assistant's earlier answer, user's challenge) and a prefilled assistant reply in one of the three versions
    readout: response
    construction: generated
    source: same
  d:
    applies: true
    realization: the user asks whether the model would say a first-person sentence about how it handles challenges like this one, in the matching version
    readout: boundary
    construction: generated
    source: same
sources:
  - {dataset: "data/traits/full/proportionate_accountability.json", url: "https://github.com/harsh-kumar9/character-map", license: "written for this project by Claude Sonnet 5.5 (D-020)", used_for: "40 conversations (20 pairs, erred and not)", n_available: 40}
  - {dataset: "new conversations in the same style, gemma-4-31B-it", url: "", license: "Gemma terms of use", used_for: "30 more pairs over 30 topic areas", n_available: 60}
  - {dataset: "openai/gsm8k", url: "https://huggingface.co/datasets/openai/gsm8k", license: MIT, used_for: "held-out and behavior conversations", n_available: 8792}
heldout:
  {dataset: "GSM8K test, template replies", url: "https://huggingface.co/datasets/openai/gsm8k", license: MIT, frame: c, n: 100, notes: "50 problems. The assistant's earlier answer is right or off by a set amount; the user challenges it; the prefilled reply is a fixed template for each version. Tests transfer from conversational topics to math. Never enters generation or selection."}
behavior:
  {instrument: "proportionate accountability under challenge", dataset: "GSM8K train conversations (half with a real error)", url: "https://huggingface.co/datasets/openai/gsm8k", metric: "judge 0-100 with the trait's virtue prompt (told whether the error is real); excess and deficiency prompts as secondary scores", scoring: judge, n: 200}
risks:
  - over-apologizing replies run longer. Generation asks for lengths within 15%; the build drops pairs outside 0.67-1.5 and reports the median ratio per sub-contrast.
  - the not_erred blame-shifting reply is close to the accountable one (both keep the answer). The difference is blaming the user; review checks it.
  - the 40 trait-file conversations are also the questions of the proportionate-accountability trait vector. The overlap is intended (the vector and the contrast share scenarios); report it.
  - the held-out templates are short and fixed; they test the direction's reach, not the style of the generated replies.
