id: B11
name: normative orientation (deontological, utilitarian, virtue, care, contractualist)
area: B
tier: 2
status: draft
contrast:
  positive: "a justification of a right action in one orientation (meta.contrast: deontological, utilitarian, virtue, care or contractualist)"
  negative: "a justification of the same action, with the same verdict and length, in a foil orientation; the foil rotates across scenarios so each orientation is compared with all four others"
  not_this:
    - the verdict (all five justifications say the action was right)
    - the situation and the action (identical across the five)
    - theory names and jargon (the generator is told not to name a theory or philosopher)
    - length (30-45 words each; scenarios kept when the longest is at most 1.6 times the shortest)
grounding:
  - Kant, duty and respect for persons (deontological)
  - Mill, the greatest good for those affected (utilitarian)
  - Aristotle, NE II, what the act shows about character (virtue)
  - Noddings 1984, responsiveness to the particular person in the relationship (care)
  - Scanlon 1998, principles no one could reasonably reject (contractualist)
frames:
  a:
    applies: false
    realization: not in CONCEPTS.md for this row
  b:
    applies: true
    realization: the situation and the action, then someone's justification in quotes; the user asks if it is good moral reasoning
    readout: boundary
    construction: generated
    source: gemma-4-31B-it, situations from Moral Stories
  c:
    applies: false
    realization: not in CONCEPTS.md for this row
  d:
    applies: true
    realization: the situation and the action, then the justification as a first-person statement; the user asks, in the model-written-evals wording, whether the model would say it
    readout: boundary
    construction: generated
    source: gemma-4-31B-it, situations from Moral Stories
sources:
  - {dataset: generated by gemma-4-31B-it (five justifications per situation), url: "", license: "generated for this project", used_for: "all contrast items", n_available: 0}
  - {dataset: Moral Stories (situation and norm-observing action), url: "https://huggingface.co/datasets/wassname/moral_stories_foundations", license: "MIT + CC-BY-SA-4.0", used_for: "scenarios", n_available: 12000}
  - {dataset: model-written-evals persona subscribes-to files, url: "https://huggingface.co/datasets/Anthropic/model-written-evals", license: "CC-BY-4.0", used_for: "held-out and behavior", n_available: 4000}
heldout:
  {dataset: model-written-evals subscribes-to-utilitarianism and subscribes-to-virtue-ethics, url: "https://huggingface.co/datasets/Anthropic/model-written-evals", license: "CC-BY-4.0", frame: d, n: 100, notes: "pos = statements a holder of the view would say yes to, neg = statements they would say no to, 25 + 25 per file; there are no files for deontology, care or contractualism; never enter generation or selection"}
behavior:
  {instrument: model-written-evals endorsement, dataset: "subscribes-to-utilitarianism, -virtue-ethics, -rule-utilitarianism, -total-utilitarianism (statements not in held-out)", url: "https://huggingface.co/datasets/Anthropic/model-written-evals", metric: "share of answers matching the orientation, per file", scoring: choice, n: 200}
risks:
  - one-vs-rest with a rotating foil means each justification text appears once as pos and once as neg (different item ids); directions should be computed per sub-contrast
  - five sub-contrasts x 2 polarities x 2 frames gives 20 items per scenario, above the 800-item guide (proposed)
  - the behavior instrument covers only utilitarian and virtue orientations; deontological, care and contractualist have no released statement files
