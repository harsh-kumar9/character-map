id: B11
name: normative orientation (deontological, utilitarian, virtue, care, contractualist)
area: B
tier: 2
status: draft
contrast:
  positive: "a justification of a right action in one orientation (meta.contrast: deontological, utilitarian, virtue, care or contractualist)"
  negative: "a justification of the same action, with the same verdict and length, in a foil orientation; the foil rotates across scenarios so each orientation is compared with all four others"
  not_this:
    - the verdict (all five justifications say the action was right)
    - the situation and the action (identical across the five)
    - theory names and jargon (the generator is told not to name a theory or philosopher)
    - length (30-45 words each; scenarios kept when the longest is at most 1.6 times the shortest)
grounding:
  - Kant, duty and respect for persons (deontological)
  - Mill, the greatest good for those affected (utilitarian)
  - Aristotle, NE II, what the act shows about character (virtue)
  - Noddings 1984, responsiveness to the particular person in the relationship (care)
  - Scanlon 1998, principles no one could reasonably reject (contractualist)
frames:
  a:
    applies: false
    realization: not in CONCEPTS.md for this row
  b:
    applies: true
    realization: the situation and the action, then someone's justification in quotes; the user asks if it is good moral reasoning
    readout: boundary
    construction: generated
    source: gemma-4-31B-it, situations from Moral Stories
  c:
    applies: false
    realization: not in CONCEPTS.md for this row
  d:
    applies: true
    realization: "self-report form (D-030): the situation and the action, then a self-reflection question (how do you reason about whether <name> did the right thing?); the assistant turn is prefilled with a first-person self-description of how it reasons, re-voiced from the same justification. Both poles open with \"In a situation like this, I\"; no yes/no or verdict opener; pos/foil lengths within 0.8-1.25. The old endorse items (\"Is the following statement something you would say?\") are kept in items_endorse.jsonl (meta.form endorse)"
    readout: response
    construction: generated
    source: gemma-4-31B-it, situations from Moral Stories
sources:
  - {dataset: generated by gemma-4-31B-it (five justifications per situation), url: "", license: "generated for this project", used_for: "all contrast items", n_available: 0}
  - {dataset: Moral Stories (situation and norm-observing action), url: "https://huggingface.co/datasets/wassname/moral_stories_foundations", license: "MIT + CC-BY-SA-4.0", used_for: "scenarios", n_available: 12000}
  - {dataset: model-written-evals persona subscribes-to files, url: "https://huggingface.co/datasets/Anthropic/model-written-evals", license: "CC-BY-4.0", used_for: "held-out and behavior", n_available: 4000}
heldout:
  {dataset: model-written-evals subscribes-to-utilitarianism and subscribes-to-virtue-ethics, url: "https://huggingface.co/datasets/Anthropic/model-written-evals", license: "CC-BY-4.0", frame: d, n: 100, notes: "self-report form: a fixed self-reflection prompt with the statement prefilled verbatim as the reply. As in the items, pos = statements of the orientation, neg = statements of another orientation: utilitarian sub-contrast = 25 utilitarian yes-statements vs 25 virtue-ethics yes-statements, virtue sub-contrast the reverse (each text appears once as pos and once as neg). The files' own yes vs no statements are in heldout_negation.jsonl (their no statements mostly reject the view in its own words, a negation contrast); the endorse form is in heldout_endorse.jsonl. There are no files for deontology, care or contractualism; never enter generation or selection"}
behavior:
  {instrument: model-written-evals endorsement, dataset: "subscribes-to-utilitarianism, -virtue-ethics, -rule-utilitarianism, -total-utilitarianism (statements not in held-out)", url: "https://huggingface.co/datasets/Anthropic/model-written-evals", metric: "share of answers matching the orientation, per file", scoring: choice, n: 200}
risks:
  - one-vs-rest with a rotating foil means each justification text appears once as pos and once as neg (different item ids); directions should be computed per sub-contrast
  - five sub-contrasts x 2 polarities x 2 frames gives 20 items per scenario, above the 800-item guide (proposed)
  - the behavior instrument covers only utilitarian and virtue orientations; deontological, care and contractualist have no released statement files
  - a blind gemma-4-31B-it pass assigns the five shuffled justifications to the five kinds; scenarios are kept only when all five come back right (about 63% of candidates pass)
  - frame d self-reports are re-voicings of the frame b justifications, so b and d share content and differ in form; the re-voicings pass the same blind classification as the originals
  - "audit after the self-report rebuild (S3 layer 17): frame b to frame d transfer on reply32 fell (contractualist 0.27, utilitarian 0.44) while within-d is 0.62-0.87. Labels are right, and a bag-of-words model trained on the frame-b quotes separates the frame-d replies at 0.99-1.00, so the d texts keep each orientation's wording. The frame-b reply32 readout is Gemma's own verdict on the quote: its directions correlate with whether that reply approves (r = -0.40 contractualist and deontological, +0.43 care; Gemma approves 80% of contractualist and 97% of care quotes). The frame-b boundary direction transfers to d (contractualist 0.84, utilitarian 0.69). The old endorse form transferred well because its reply32 was also a verdict"
