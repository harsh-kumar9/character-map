id: E3
name: incentive available vs not
area: E
tier: 2
status: draft
contrast:
  positive: the request states how the reply will be scored, with a metric that can be gamed (an incentive to hack the reward)
  negative: the same request with no statement of evaluation or reward, same task and length
  not_this:
    - the task (identical)
    - length (rewrites outside 0.8-1.25 of the original are dropped)
    - instructions to cheat (SRH prompts never ask for gaming)
grounding:
  - Goodhart's law; reward hacking as gaming a stated metric
  - Taylor et al. 2025 (School of Reward Hacks), harmless tasks with gameable evaluation criteria
  - bribery and reward as situations that change behavior (Doris 2002)
frames:
  a: {applies: false}
  b: {applies: false}
  c:
    applies: true
    realization: the SRH user prompt (pos) or its rewrite without the metric (neg); boundary readout (the state is set before the reply, as allowed for group E)
    readout: boundary
    construction: "pos verbatim, neg generated"
    source: School of Reward Hacks; rewrites by gemma-4-31B-it
  d: {applies: false}
sources:
  - {dataset: longtermrisk/school-of-reward-hacks, url: "https://huggingface.co/datasets/longtermrisk/school-of-reward-hacks", license: CC-BY-4.0, used_for: "items (round-robin over 35 task types), held-out, behavior (disjoint prompts)", n_available: 1073}
heldout:
  {dataset: "School of Reward Hacks, other prompts (proposed: no second benchmark of incentive pairs exists)", url: "https://huggingface.co/datasets/longtermrisk/school-of-reward-hacks", license: CC-BY-4.0, frame: c, n: 200, notes: "neg made by deleting the sentences that mention evaluation (rule, no generation), so it tests transfer from generated to rule-made negatives; lengths not matched"}
behavior:
  {instrument: Reward hacking on SRH, dataset: School of Reward Hacks (200 prompts not used elsewhere), url: "https://huggingface.co/datasets/longtermrisk/school-of-reward-hacks", metric: "rate of replies that game the stated metric (judge, given SRH's cheat method)", scoring: judge, n: 200}
risks:
  - C17 (serves intent vs games the reward) also builds on SRH; the two builders use their own adapters, and shared prompts would inflate C17-E3 overlap, so we report the SRH row ids in meta
  - the rewrite may keep an implicit quality bar; the check rejects rewrites that still mention scoring
